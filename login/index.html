<style>
:root{--ink:#1b2a4a;--muted:#5b6577;--line:#e6e9f0;--paper:#f5f8fd;--accent:#7a1f2b;--saffron:#f2a024}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 50% -10%,#eef3fb,#f7f9fc);min-height:100vh;display:grid;place-items:center;padding:28px}
.auth-wrap{width:100%;max-width:404px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(27,42,74,.10);padding:30px 30px 26px}
.auth-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-bottom:22px}
.auth-brand img{width:34px;height:34px}
.auth-brand span{font-family:Inter,sans-serif;font-weight:800;letter-spacing:.04em;font-size:15px}
.auth-brand b{color:var(--saffron);font-weight:800}
h1{font-family:Montserrat,sans-serif;font-size:23px;font-weight:800;letter-spacing:-.01em}
.asub{color:var(--muted);font-size:14px;margin:5px 0 18px}
.amsg{display:none;font-size:13.5px;border-radius:10px;padding:10px 12px;margin-bottom:14px}
.amsg.err{display:block;background:#fdecec;color:#b3261e;border:1px solid #f5c2c0}
.amsg.ok{display:block;background:#eaf7ef;color:#0c7a45;border:1px solid #b9e3c9}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:Inter,sans-serif;transition:.16s}
.gbtn:hover{background:var(--paper);border-color:#cfd6e4}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}
input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:14.5px;font-family:Inter,sans-serif;margin-bottom:14px;transition:.16s;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,31,43,.10)}
.forgot{display:inline-block;font-size:12.5px;color:var(--accent);text-decoration:none;margin:-6px 0 14px 2px;font-weight:600}
.forgot:hover{text-decoration:underline}
.pbtn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;transition:.16s}
.pbtn:hover{filter:brightness(1.07)}
.pbtn:disabled{opacity:.6;cursor:default}
.toggle{text-align:center;font-size:13.5px;color:var(--muted);margin-top:16px}
.toggle a{color:var(--accent);font-weight:600;text-decoration:none}
.toggle a:hover{text-decoration:underline}
.legal{text-align:center;font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.5}
.legal a{color:var(--muted);text-decoration:underline}
.back{text-align:center;margin-top:16px}
.back a{color:var(--muted);font-size:13px;text-decoration:none}
.back a:hover{color:var(--ink)}
.appctx{display:none;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--muted);margin-bottom:16px}
.appctx.show{display:flex}
.appdot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
</style></head><body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var SB_URL="https://ezgfvvqwokxvqmheijmd.supabase.co";
  var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6Z2Z2dnF3b2t4dnFtaGVpam1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMjY1MTIsImV4cCI6MjA5NjkwMjUxMn0.VwmCIsDqIbLzWmmgXqkIiIO5z27fAUitiWhYT7L1pkI";
  var sb=window.supabase.createClient(SB_URL,SB_KEY);
  var q=new URLSearchParams(location.search);
  var app=(q.get("app")||"").toLowerCase();
  var APPS={
    seedhabill:{name:"Seedha Bill",ret:"https://seedhabill.prabhassaas.in/app.html"},
    lekhya:{name:"Lekhya AI",ret:"https://lekhya.prabhassaas.in/"},
    desk:{name:"Desk",ret:"/app/desk/"},
    shilp3d:{name:"Shilp3D",ret:"https://shilp3d.prabhassaas.in/"}
  };

  /* Where a session may be handed to.
   *
   * This list is the whole security of the handoff below, and it is not
   * optional. `?return=` comes from the query string, so anyone can put
   * anything in it; without a check, a crafted link would send a signed-in
   * person to an attacker's page with their access token in the fragment.
   * Only Prabhas SaaS hosts are ever given a token. */
  function trustedForHandoff(u){
    return u.protocol==="https:" &&
      (u.hostname==="prabhassaas.in" ||
       /* Length written out rather than counted by hand: the first attempt
          used 17 for a 15-character suffix and rejected the app itself. */
       u.hostname.slice(-".prabhassaas.in".length)===".prabhassaas.in");
  }

  /* Send the person on, carrying their session if the destination is a
   * different site.
   *
   * Apps on their own subdomain — shilp3d.prabhassaas.in — cannot read the
   * session stored here: localStorage is per origin, so signing in on
   * prabhassaas.in leaves them signed out. That is exactly what kept being
   * reported as "I logged in on the website but the app asks again".
   *
   * The tokens travel in the URL *fragment*, never the query string. A
   * fragment is not sent to servers, so it cannot land in an access log or a
   * proxy trace on the way. This is the same shape Supabase's own OAuth
   * redirect uses, which is why the app already knows how to read it. */
  function handoff(session){
    var d=absdest();
    try{
      var u=new URL(d, location.origin);
      if(u.origin!==location.origin && session && session.access_token){
        if(!trustedForHandoff(u)){ location.href="/account/"; return; }
        u.hash="access_token="+encodeURIComponent(session.access_token)
          +"&refresh_token="+encodeURIComponent(session.refresh_token||"")
          +"&expires_in="+(session.expires_in||3600)
          +"&token_type=bearer";
        location.href=u.toString();
        return;
      }
    }catch(e){}
    location.href=d;
  }
  var conf=APPS[app]||{name:"Prabhas SaaS",ret:"/account/"};
  function dest(){var r=q.get("return");if(r)return r;if(app&&APPS[app])return APPS[app].ret;return (mode==="signup")?"/pricing/":"/account/";}
  function absdest(){var d=dest();return d.charAt(0)==="/"?location.origin+d:d;}
  var mode=(q.get("mode")==="signup")?"signup":"login";
  var $=function(id){return document.getElementById(id);};
  var msg=function(t,k){var m=$("amsg");m.textContent=t;m.className="amsg "+(k||"err");};
  var clearMsg=function(){$("amsg").className="amsg";};

  function render(){
    if(app && APPS[app]){$("appctx").classList.add("show");$("appctxt").textContent="Continuing to "+conf.name;}
    if(mode==="signup"){
      $("atitle").textContent="Create your account";
      $("asub").textContent="One Prabhas ID for every app in the suite.";
      $("submit").textContent="Create account";
      $("pass").setAttribute("autocomplete","new-password");
      $("toggle").innerHTML='Already have an account? <a id="tlink" href="#">Sign in</a>';
    }else{
      $("atitle").textContent="Welcome back";
      $("asub").textContent="Sign in to your Prabhas account.";
      $("submit").textContent="Continue";
      $("pass").setAttribute("autocomplete","current-password");
      $("toggle").innerHTML='New to Prabhas SaaS? <a id="tlink" href="#">Create an account</a>';
    }
    $("tlink").onclick=function(e){e.preventDefault();mode=(mode==="login")?"signup":"login";clearMsg();render();};
  }

  // already signed in -> go straight through
  sb.auth.getSession().then(function(r){ if(r.data && r.data.session){ handoff(r.data.session); } });

  $("gbtn").onclick=function(){
    clearMsg();
    sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:absdest()}})
      .then(function(r){ if(r.error){ msg(r.error.message); } });
  };

  $("submit").onclick=async function(){
    clearMsg();
    var email=$("email").value.trim(), pass=$("pass").value;
    if(!email||!pass){ msg("Please enter your email and password."); return; }
    var btn=$("submit"); btn.disabled=true; var label=btn.textContent; btn.textContent="Please wait…";
    try{
      if(mode==="signup"){
        var r=await sb.auth.signUp({email:email,password:pass,options:{emailRedirectTo:absdest()}});
        if(r.error){ msg(r.error.message); }
        else if(r.data.session){ handoff(r.data.session); }
        else { msg("Check your inbox to confirm your email, then sign in.","ok"); }
      }else{
        var r2=await sb.auth.signInWithPassword({email:email,password:pass});
        if(r2.error){ msg(r2.error.message); }
        else { handoff(r2.data && r2.data.session); }
      }
    }catch(e){ msg("Something went wrong. Please try again."); }
    btn.disabled=false; btn.textContent=label;
  };

  $("forgot").onclick=async function(e){
    e.preventDefault(); clearMsg();
    var email=$("email").value.trim();
    if(!email){ msg("Enter your email above, then tap Forgot password."); return; }
    var r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/reset/"});
    if(r.error){ msg(r.error.message); } else { msg("Password reset link sent to "+email+".","ok"); }
  };

  $("peye").onclick=function(){var p=$("pass");var on=p.type==="password";p.type=on?"text":"password";$("peye").innerHTML=on?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';};
  render();
})();
</script>
