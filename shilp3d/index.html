    <title>Shilp3D Naksha — Civil Planning &amp; Construction</title>
    <script>
      // Apply the stored theme before first paint. Without this the dark
      // default would flash for a light-theme user on every load.
      (function () {
        try {
          var stored = localStorage.getItem('shilp3d.theme');
          var pref = stored === 'light' || stored === 'dark' ? stored : 'system';
          var theme =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref;
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafc' : '#020617');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
